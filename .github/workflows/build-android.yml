name: Build Game Studio Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android project
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          data = ''''''
          pathlib.Path('/tmp/GameStudio-Android-V1.8.0.zip').write_bytes(base64.b64decode(data))
          PY
          unzip -q /tmp/GameStudio-Android-V1.8.0.zip -d $GITHUB_WORKSPACE

      - name: Build debug APK
        working-directory: GameStudio-Android-V1.8.0
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp GameStudio-Android-V1.8.0/app/build/outputs/apk/debug/app-debug.apk output/GameStudio-V1.8.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameStudio-V1.8.0-APK
          path: output/GameStudio-V1.8.0.apk
          if-no-files-found: error
