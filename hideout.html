<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0F17">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HIDEOUT — سيد المخبأ</title>
<style>
:root{
  --bg:#0B0F17;
  --bg2:#0F1420;
  --panel:#141B29;
  --panel2:#1A2333;
  --card:#1E2A3F;
  --line:#2A3A54;
  --line2:#374A69;
  --text:#EAF0FA;
  --muted:#8CA0C2;
  --dim:#5C6E8C;
  --yellow:#F4D64B;   /* power / electricity */
  --cyan:#3FD7E0;     /* info / tech */
  --orange:#FF9A4D;   /* production */
  --red:#FF5E67;      /* danger / defense */
  --green:#3FDE8F;    /* health / support */
  --violet:#9C7CFF;   /* special / tech-deep */
  --gold:#F0C34D;     /* economy */
  --shadow:0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',Tajawal,system-ui,-apple-system,Arial,sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% -10%,#182238 0%,var(--bg) 60%);position:relative;overflow:hidden}

/* ---------- TOP RESOURCE BAR ---------- */
#resbar{display:flex;gap:5px;padding:8px 8px 6px;flex-shrink:0}
.res{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:5px 2px;text-align:center;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px}
.res .ic{font-size:14px;line-height:1}
.res b{font-size:12.5px}
.res.cash b{color:var(--gold)}
.res.respect b{color:var(--violet)}
.res.intel b{color:var(--cyan)}
.res.parts b{color:var(--orange)}
.res.heat b{color:var(--red)}
.res.heat{position:relative;overflow:hidden}
.res.heat i{position:absolute;inset:auto 0 0 0;height:3px;background:var(--red);transition:width .4s}

/* ---------- STAGE / HIDEOUT VIEWPORT ---------- */
#stage{flex:1;position:relative;overflow:hidden;margin:0 8px;border-radius:16px;
  background:linear-gradient(180deg,#0E1522,#0A0E17 70%);border:1px solid var(--line);box-shadow:inset 0 0 40px rgba(0,0,0,.4)}
#viewport{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#gridwrap{position:relative;padding:26px 14px 60px;min-width:100%;min-height:100%;display:flex;align-items:flex-start;justify-content:center}
#grid{position:relative;display:grid}
.cell{position:relative}
.cell.locked{background:repeating-linear-gradient(135deg,#131A28 0 6px,#0F1420 6px 12px);
  border-radius:5px;margin:1px;opacity:.55}
.cell.unlocked-empty{border:1.5px dashed var(--line2);border-radius:5px;margin:1px;opacity:0;transition:opacity .2s}
.buildmode .cell.unlocked-empty{opacity:1}
.cell.anchor-ok{background:rgba(63,222,143,.18);border-color:var(--green)}
.cell.anchor-bad{background:rgba(255,94,103,.18);border-color:var(--red)}

.entrance{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#2A3550,#1B2333);border:1.5px solid var(--line2);border-radius:8px 8px 3px 3px;
  font-size:16px;z-index:2;margin:1px}
.entrance small{font-size:8px;color:var(--muted);margin-top:1px}

.room{position:absolute;margin:1px;border-radius:9px;overflow:hidden;z-index:3;
  border:1.5px solid var(--rc,var(--line2));background:linear-gradient(165deg,var(--rc2,#1E2A3F) 0%, #141B29 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.35);display:flex;flex-direction:column;transition:box-shadow .2s,transform .15s}
.room.inactive{filter:grayscale(.7) brightness(.55)}
.room.pulse{animation:pulseSyn 1.1s ease}
@keyframes pulseSyn{0%{box-shadow:0 0 0 0 rgba(63,222,143,.6)}100%{box-shadow:0 0 0 14px rgba(63,222,143,0)}}
.room.penalized{animation:pulseWarn 1.1s ease}
@keyframes pulseWarn{0%{box-shadow:0 0 0 0 rgba(255,94,103,.55)}100%{box-shadow:0 0 0 14px rgba(255,94,103,0)}}
.room .rhead{display:flex;align-items:center;gap:3px;padding:3px 4px 0;font-size:9.5px;font-weight:800;color:var(--rc,#cfe);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .ricon{font-size:13px}
.room .rbody{flex:1;position:relative}
.room .tok{position:absolute;font-size:15px;transform:translate(-50%,-50%);transition:left 1.1s ease,top 1.1s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.room .lvl{position:absolute;bottom:2px;left:3px;font-size:8px;color:var(--muted);background:rgba(0,0,0,.35);padding:0 3px;border-radius:4px}
.room .pwr{position:absolute;bottom:2px;right:3px;font-size:8px;font-weight:700}
.room .pwr.on{color:var(--yellow)}
.room .pwr.off{color:var(--dim)}
.room.selected{outline:2px solid #fff;outline-offset:1px}
.room.raid-target{outline:2px solid var(--red);animation:pulseWarn 1s infinite}
.room.raid-clear{outline:2px solid var(--green)}

.doorline{position:absolute;background:var(--line2);z-index:1;border-radius:2px}
.doorline.locked-edge{background:var(--red);opacity:.6}
.pathline{position:absolute;background:rgba(255,94,103,.55);z-index:2;border-radius:2px;pointer-events:none}

#ghost{position:fixed;pointer-events:none;z-index:400;opacity:.85;border-radius:8px;
  border:2px dashed #fff;display:none;transition:background .1s}
#ghost.ok{background:rgba(63,222,143,.35);border-color:var(--green)}
#ghost.bad{background:rgba(255,94,103,.35);border-color:var(--red)}

/* floating badges */
.floatbadge{position:absolute;z-index:60;background:rgba(10,14,22,.92);border:1px solid var(--line2);
  border-radius:8px;padding:3px 7px;font-size:10px;font-weight:700;pointer-events:none;
  animation:floatUp 1.4s ease forwards;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translateY(4px)}15%{opacity:1;transform:translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* ---------- STAGE HUD (cycle / phase banner) ---------- */
#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;
  align-items:center;pointer-events:none;z-index:50}
#hud .chip{pointer-events:auto;background:rgba(10,14,22,.85);border:1px solid var(--line2);border-radius:20px;
  padding:5px 10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;backdrop-filter:blur(3px)}
#phaseBtn{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:55;
  background:linear-gradient(180deg,#3FDE8F,#22B06A);color:#08150E;font-weight:900;font-size:13px;
  padding:11px 22px;border-radius:30px;box-shadow:0 8px 18px rgba(63,222,143,.35);letter-spacing:.3px}
#phaseBtn:active{transform:translateX(-50%) scale(.96)}
#buildBar{position:absolute;left:0;right:0;bottom:0;z-index:54;background:linear-gradient(0deg,rgba(10,14,22,.97),rgba(10,14,22,.85));
  border-top:1px solid var(--line2);padding:8px 8px 10px;display:none;gap:6px;overflow-x:auto;align-items:center}
.buildmode #buildBar{display:flex}
.invcard{flex-shrink:0;width:64px;background:var(--card);border:1.5px solid var(--rc,var(--line2));border-radius:10px;
  padding:5px;text-align:center;font-size:9px;font-weight:700}
.invcard .ic2{font-size:18px}
.invcard.armed{outline:2px solid #fff}
#buildExit{position:absolute;top:6px;right:6px;z-index:56;background:rgba(10,14,22,.88);border:1px solid var(--line2);
  border-radius:16px;padding:6px 12px;font-size:11px;font-weight:800;display:none}
.buildmode #buildExit{display:block}

/* ---------- BOTTOM NAV ---------- */
#bottomnav{display:flex;flex-shrink:0;padding:6px 8px 10px;gap:4px}
#bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;
  border-radius:12px;font-size:9.5px;font-weight:700;color:var(--muted)}
#bottomnav button .ic3{font-size:18px}
#bottomnav button.active{color:var(--text);background:var(--panel2)}

/* ---------- SHEET / MODAL ---------- */
#overlay{position:absolute;inset:0;background:rgba(4,6,10,.62);z-index:200;display:none;backdrop-filter:blur(1px)}
#overlay.show{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:201;background:var(--bg2);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line2);max-height:82%;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;
  padding:14px 14px 20px;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#sheet.show{transform:translateY(0)}
#sheet .handle{width:38px;height:4px;background:var(--line2);border-radius:3px;margin:0 auto 10px}
#modal{position:absolute;left:10px;right:10px;top:50%;z-index:202;background:var(--bg2);border-radius:18px;
  border:1px solid var(--line2);transform:translate(0,-50%) scale(.92);opacity:0;transition:transform .2s,opacity .2s;
  max-height:80%;overflow-y:auto;padding:16px;pointer-events:none;box-shadow:var(--shadow)}
#modal.show{opacity:1;transform:translate(0,-50%) scale(1);pointer-events:auto}

h3.stitle{margin:0 0 10px;font-size:15px;font-weight:900}
p.sdesc{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:9px 14px;font-weight:800;font-size:12.5px}
.btn.primary{background:linear-gradient(180deg,#3FDE8F,#22B06A);color:#08150E}
.btn.danger{background:linear-gradient(180deg,#FF6B72,#D93A44);color:#2A0508}
.btn.gold{background:linear-gradient(180deg,#F0C34D,#C9992A);color:#2A1E02}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.block{width:100%;text-align:center}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}

.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:10.5px;font-weight:700}

.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.shopcard{background:var(--card);border:1.5px solid var(--rc,var(--line2));border-radius:13px;padding:9px;position:relative}
.shopcard .rarity{position:absolute;top:6px;right:6px;font-size:8px;font-weight:900;padding:1px 6px;border-radius:8px}
.shopcard .icobig{font-size:26px;display:block;margin-bottom:3px}
.shopcard .nm{font-size:11.5px;font-weight:800;margin-bottom:2px}
.shopcard .desc{font-size:9.5px;color:var(--muted);line-height:1.4;min-height:26px}
.shopcard .cost{margin-top:6px;font-size:11px;font-weight:800;color:var(--gold)}
.shopcard.frozen{outline:2px solid var(--cyan)}
.shopcard.bought{opacity:.35;pointer-events:none}

.crewcard{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:9px;margin-bottom:8px;display:flex;gap:9px}
.crewcard .av{width:42px;height:42px;border-radius:10px;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid var(--line2)}
.crewcard .info{flex:1;min-width:0}
.crewcard .nm{font-weight:900;font-size:12.5px}
.crewcard .role{font-size:9.5px;color:var(--muted);margin-bottom:3px}
.bar{height:5px;border-radius:3px;background:#0B0F17;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%}
.bar.hp i{background:var(--red)}
.bar.mo i{background:var(--cyan)}
.bar.lo i{background:var(--violet)}

.eventchoice{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px;margin-bottom:8px;text-align:right}
.eventchoice small{display:block;color:var(--muted);margin-top:3px;font-size:10px}

#log{font-size:10.5px;line-height:1.7;color:var(--muted);max-height:120px;overflow-y:auto;background:#0A0E17;
  border-radius:10px;padding:8px;border:1px solid var(--line);margin:8px 0}
#log b{color:var(--text)}
#log .hit{color:var(--red)}
#log .win{color:var(--green)}

.tactrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.tactbtn{background:var(--card);border:1.5px solid var(--line2);border-radius:11px;padding:8px 2px;text-align:center;font-size:9px;font-weight:800}
.tactbtn .ic4{font-size:17px;display:block;margin-bottom:2px}
.tactbtn:disabled{opacity:.3}

.districtcard{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:11px;margin-bottom:9px}
.districtcard.locked{opacity:.45}
.districtcard .dn{font-weight:900;font-size:13px}
.districtcard .dt{font-size:10px;color:var(--muted);margin:3px 0 6px}

#toast{position:absolute;top:44px;left:50%;transform:translateX(-50%);z-index:300;background:rgba(10,14,22,.95);
  border:1px solid var(--line2);border-radius:20px;padding:7px 14px;font-size:11px;font-weight:800;opacity:0;
  transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}

#bootscreen{position:absolute;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
#bootscreen h1{font-size:26px;margin:0;letter-spacing:1px}
#bootscreen h1 span{color:var(--red)}
#bootscreen p{color:var(--muted);font-size:12.5px;line-height:1.7;margin:0}
.setupcol{width:100%;text-align:right}
.setupcol h4{font-size:12px;color:var(--muted);margin:12px 0 6px}
.pickcard{background:var(--card);border:2px solid var(--line2);border-radius:12px;padding:10px;margin-bottom:7px;text-align:right}
.pickcard.sel{border-color:var(--green);background:rgba(63,222,143,.08)}
.pickcard b{font-size:12.5px}
.pickcard small{display:block;color:var(--muted);font-size:10px;margin-top:2px}

::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div id="app">

  <div id="resbar">
    <div class="res cash"><span class="ic">💵</span><b id="rCash">0</b></div>
    <div class="res respect"><span class="ic">⭐</span><b id="rRespect">0</b></div>
    <div class="res intel"><span class="ic">🛰️</span><b id="rIntel">0</b></div>
    <div class="res parts"><span class="ic">⚙️</span><b id="rParts">0</b></div>
    <div class="res heat"><span class="ic">🔥</span><b id="rHeat">0</b><i id="rHeatBar" style="width:0%"></i></div>
  </div>

  <div id="stage">
    <div id="hud">
      <div class="chip">🌆 <span id="hudDistrict">Old Block</span></div>
      <div class="chip">دورة <span id="hudCycle">1</span></div>
    </div>
    <div id="viewport">
      <div id="gridwrap">
        <div id="grid"></div>
      </div>
    </div>
    <button id="buildExit">✕ إنهاء البناء</button>
    <div id="buildBar"></div>
    <button id="phaseBtn">ابدأ ▶</button>
    <div id="toast"></div>
  </div>

  <div id="bottomnav">
    <button data-tab="hideout" class="active"><span class="ic3">🏚️</span>المخبأ</button>
    <button data-tab="crew"><span class="ic3">👥</span>الطاقم</button>
    <button data-tab="city"><span class="ic3">🏙️</span>المدينة</button>
    <button data-tab="shop"><span class="ic3">🛒</span>المتجر</button>
    <button data-tab="upgrades"><span class="ic3">⬆️</span>التطوير</button>
  </div>

  <div id="overlay"></div>
  <div id="sheet"><div class="handle"></div><div id="sheetBody"></div></div>
  <div id="modal"><div id="modalBody"></div></div>
  <div id="ghost"></div>

  <div id="bootscreen"></div>
</div>

<script>
"use strict";
/* ============================================================================================
   HIDEOUT — سيد المخبأ
   Vertical-slice prototype implementing the core loop described in the master design brief:
   grid-based hideout construction (irregular shapes + expansions), room synergies/penalties,
   a power grid with priorities, a living crew with roles/traits/flaws/morale/loyalty,
   a Shop -> Build -> Crew -> Event -> Threat -> Raid -> Reward cycle loop, pathfinding-based
   raid combat through the player's own layout with limited tactical commands, a Heat
   risk/reward meter, a 4-currency economy, a light city/district structure, and a small
   cross-run meta-progression layer. Single-file, no dependencies, portrait/mobile-first.
   ============================================================================================ */

/* ---------------------------------- GEOMETRY / SHAPES ---------------------------------- */
const COLS = 7, ROWS = 11;
const ENTRANCE = {c:3, r:0};

function normalize(cells){
  let minC=Math.min(...cells.map(p=>p[0])), minR=Math.min(...cells.map(p=>p[1]));
  return cells.map(([c,r])=>[c-minC,r-minR]);
}
function rot90(cells){ return normalize(cells.map(([c,r])=>[-r,c])); }
function rotN(cells,n){ let s=cells; for(let i=0;i<((n%4)+4)%4;i++) s=rot90(s); return s; }
const SHAPES = {
  S1x1:[[0,0]],
  S1x2:[[0,0],[1,0]],
  S2x1:[[0,0],[0,1]],
  S2x2:[[0,0],[1,0],[0,1],[1,1]],
  S2x3:[[0,0],[1,0],[0,1],[1,1],[0,2],[1,2]],
  S3x2:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],
  SL:  [[0,0],[0,1],[1,1]],
  ST:  [[0,0],[1,0],[2,0],[1,1]],
};
const EXPANSION_POOL = ["S2x2","S1x2","S2x1","SL","ST","S2x3","S3x2"];

/* ---------------------------------- ROOM CATALOG ---------------------------------- */
// power: negative = consumes, positive = produces. rarity weight for shop draws.
const ROOMS = [
  {id:"generator",name:"Generator",nameAr:"المولد",cat:"UTILITY",shape:"S2x2",power:6,crewCap:1,rarity:"common",cost:60,
    color:"#F4D64B",icon:"🔋",desc:"ينتج 6 طاقة. يسبب ضوضاء وحرارة."},
  {id:"battery",name:"Battery Room",nameAr:"غرفة البطاريات",cat:"UTILITY",shape:"S1x2",power:-1,crewCap:0,rarity:"uncommon",cost:70,
    color:"#F4D64B",icon:"🔌",desc:"تخزن طاقة احتياطية عند الانقطاع."},
  {id:"ventilation",name:"Ventilation",nameAr:"التهوية",cat:"UTILITY",shape:"S1x1",power:-1,crewCap:0,rarity:"common",cost:35,
    color:"#F4D64B",icon:"🌀",desc:"تقلل من تراكم Heat."},
  {id:"maintenance",name:"Maintenance",nameAr:"الصيانة",cat:"UTILITY",shape:"S1x2",power:-1,crewCap:1,rarity:"common",cost:55,
    color:"#F4D64B",icon:"🛠️",desc:"صيانة عامة. تحسن كفاءة المولدات المجاورة."},
  {id:"bedroom",name:"Bedroom",nameAr:"غرفة النوم",cat:"SUPPORT",shape:"S2x1",power:-1,crewCap:2,rarity:"common",cost:45,
    color:"#3FDE8F",icon:"🛏️",desc:"يستريح فيها الطاقم. تزيد المعنويات."},
  {id:"kitchen",name:"Kitchen",nameAr:"المطبخ",cat:"SUPPORT",shape:"S2x1",power:-1,crewCap:1,rarity:"common",cost:45,
    color:"#3FDE8F",icon:"🍳",desc:"طعام للطاقم. تحسن المعنويات تدريجيًا."},
  {id:"lounge",name:"Lounge",nameAr:"الصالة",cat:"SUPPORT",shape:"S2x2",power:-1,crewCap:2,rarity:"uncommon",cost:75,
    color:"#3FDE8F",icon:"🛋️",desc:"استرخاء الطاقم. معنويات + ولاء."},
  {id:"clinic",name:"Clinic",nameAr:"العيادة",cat:"SUPPORT",shape:"S2x2",power:-2,crewCap:1,rarity:"uncommon",cost:90,
    color:"#3FDE8F",icon:"⛑️",desc:"تعالج إصابات الطاقم بمرور الوقت."},
  {id:"intel_room",name:"Intel Room",nameAr:"غرفة المعلومات",cat:"TECH",shape:"S2x2",power:-2,crewCap:1,rarity:"uncommon",cost:95,
    color:"#3FD7E0",icon:"🗂️",desc:"تولّد Intel وتكشف جزءًا من التهديد القادم."},
  {id:"server_room",name:"Server Room",nameAr:"غرفة الخوادم",cat:"TECH",shape:"S2x2",power:-3,crewCap:1,rarity:"rare",cost:140,
    color:"#3FD7E0",icon:"🖥️",desc:"تحسّن جودة معلومات التهديد."},

/* ============================================================================================
   GRID HELPERS
   ============================================================================================ */
function unlockedSet(){ return new Set(S.unlocked); }
function occupiedMap(){
  const m = new Map();
  S.rooms.forEach(rm=>rm.cells.forEach(([c,r])=>m.set(cellKey(c,r), rm.uid)));
  return m;
}
function inBounds(c,r){ return c>=0&&c<COLS&&r>=0&&r<ROWS; }
function canPlace(shapeCells, anchorC, anchorR, unlockedS, occMap, ignoreUid){
  for(const [dc,dr] of shapeCells){
    const c=anchorC+dc, r=anchorR+dr;
    if(!inBounds(c,r)) return false;
    if(c===ENTRANCE.c && r===ENTRANCE.r) return false;
    if(!unlockedS.has(cellKey(c,r))) return false;
    const occ = occMap.get(cellKey(c,r));
    if(occ && occ!==ignoreUid) return false;
  }
  return true;
}
function roomsAdjacentPairs(){
  const pairs=[];
  for(let i=0;i<S.rooms.length;i++){
    for(let j=i+1;j<S.rooms.length;j++){
      if(cellsAdjacent(S.rooms[i].cells, S.rooms[j].cells)) pairs.push([S.rooms[i],S.rooms[j]]);
    }
  }
  return pairs;
}
function cellsAdjacent(cellsA, cellsB){
  for(const [c1,r1] of cellsA) for(const [c2,r2] of cellsB){
    if((Math.abs(c1-c2)===1&&r1===r2)||(Math.abs(r1-r2)===1&&c1===c2)) return true;
  }
  return false;
}
function roomTouchesEntrance(room){
  for(const [c,r] of room.cells){
    if((Math.abs(c-ENTRANCE.c)===1&&r===ENTRANCE.r)||(Math.abs(r-ENTRANCE.r)===1&&c===ENTRANCE.c)) return true;
  }
  return false;
}
function distFromEntrance(room){
  // manhattan distance from nearest cell to entrance, cheap heuristic for "depth"
  let best=999;
  room.cells.forEach(([c,r])=>{ const d=Math.abs(c-ENTRANCE.c)+Math.abs(r-ENTRANCE.r); if(d<best) best=d; });
  return best;
}

/* ---------------------------------- SYNERGY / POWER / ECONOMY CALC ---------------------------------- */
function computeRoomState(){
  const info = new Map(); // uid -> {bonuses:[], penalties:[], mult:{}}
  S.rooms.forEach(rm=>info.set(rm.uid,{bonuses:[],penalties:[],mult:{}}));
  const pairs = roomsAdjacentPairs();
  pairs.forEach(([ra,rb])=>{
    SYN.forEach(rule=>{
      if(!rule.b) return;
      let hit=null;
      if(ra.defId===rule.a&&rb.defId===rule.b) hit=[ra,rb];
      else if(ra.defId===rule.b&&rb.defId===rule.a) hit=[rb,ra];
      if(!hit) return;
      const [src,tgt] = hit; // apply bonus to the "src" side that benefits (a-room)
      const target = rule.a===src.defId ? src : tgt;
      const rec = info.get(target.uid);
      if(rule.kind==="bonus"){ rec.bonuses.push(rule); rec.mult[rule.stat]=(rec.mult[rule.stat]||0)+rule.pct/100; }
      else if(rule.kind==="penalty"){ rec.penalties.push(rule); rec.mult[rule.stat]=(rec.mult[rule.stat]||0)-rule.pct/100; }
    });
  });
  // vault / secret_vault risk based on distance from entrance
  S.rooms.forEach(rm=>{
    if(rm.defId==="vault"||rm.defId==="secret_vault"){
      const d = distFromEntrance(rm);
      const rec = info.get(rm.uid);
      rec.vaultDepth = d;
    }
  });
  return info;
}
function computePower(){
  let produced=0, required=0;
  const active = [];
  S.rooms.forEach(rm=>{
    const def = ROOMBYID[rm.defId];
    if(def.power>0){ produced += def.power * (1+ (rm.level-1)*0.25); }
    else required += Math.abs(def.power);
    active.push(rm);
  });
  return {produced:Math.round(produced), required:Math.round(required)};
}
function applyPowerPriority(){
  const pwr = computePower();
  S.rooms.forEach(r=>r.active=true);
  if(pwr.produced >= pwr.required){ return pwr; }
  // shut off lowest-priority (defense highest priority, then support, then production/economy/tech/utility)
  const PRIORITY = {DEFENSE:1,SUPPORT:2,ECONOMY:3,TECH:4,PRODUCTION:5,SPECIAL:6,UTILITY:7};
  const consumers = S.rooms.filter(r=>ROOMBYID[r.defId].power<0)
    .sort((a,b)=>PRIORITY[ROOMBYID[b.defId].cat]-PRIORITY[ROOMBYID[a.defId].cat]);
  let budget = pwr.produced;
  consumers.forEach(r=>{ // reset then reapply lowest priority first shut off
  });
  // recompute: keep shutting off from the END (lowest priority) until fits
  let used = 0;
  const sortedHighFirst = consumers.slice(); // already high->low priority order due to sort desc
  for(const r of sortedHighFirst){
    const need = Math.abs(ROOMBYID[r.defId].power);
    if(used+need<=pwr.produced){ used+=need; r.active=true; } else { r.active=false; }
  }
  return pwr;
}

let cellPx = 42;
function computeCellPx(){
  const vpW = document.getElementById("viewport").clientWidth - 28;
  cellPx = Math.max(38, Math.min(52, Math.floor(vpW/COLS)));
}
function render(){
  computeCellPx();
  const grid = document.getElementById("grid");
  grid.style.width = (COLS*cellPx)+"px";
  grid.style.height = (ROWS*cellPx)+"px";
  grid.innerHTML = "";
  const uSet = unlockedSet();
  const occ = occupiedMap();
  // background cells
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(c===ENTRANCE.c&&r===ENTRANCE.r) continue;
      const key = cellKey(c,r);
      const div = document.createElement("div");
      div.style.position="absolute"; div.style.left=(c*cellPx)+"px"; div.style.top=(r*cellPx)+"px";
      div.style.width=cellPx+"px"; div.style.height=cellPx+"px";
      if(occ.has(key)) continue; // covered by a room element
      div.className = uSet.has(key) ? "cell unlocked-empty" : "cell locked";
      div.dataset.c=c; div.dataset.r=r;
      grid.appendChild(div);
    }
  }
  // entrance
  const ent = document.createElement("div");
  ent.className="entrance";
  ent.style.left=(ENTRANCE.c*cellPx)+"px"; ent.style.top=(ENTRANCE.r*cellPx)+"px";
  ent.style.width=cellPx+"px"; ent.style.height=cellPx+"px";
  ent.innerHTML = "🚪<small>مدخل</small>";
  grid.appendChild(ent);

  // synergy/power info
  const synInfo = computeRoomState();
  applyPowerPriority();

  S.rooms.forEach(rm=>{
    const def = ROOMBYID[rm.defId];
    const minC=Math.min(...rm.cells.map(p=>p[0])), minR=Math.min(...rm.cells.map(p=>p[1]));
    const maxC=Math.max(...rm.cells.map(p=>p[0])), maxR=Math.max(...rm.cells.map(p=>p[1]));
    const div = document.createElement("div");
    div.className = "room"+(rm.active?"":" inactive")+(S.raidTargetUid===rm.uid?" raid-target":"")+(S.raidClearedUids&&S.raidClearedUids.has(rm.uid)?" raid-clear":"");
    div.style.setProperty("--rc", def.color);
    div.style.setProperty("--rc2", def.color+"22");
    div.style.left=(minC*cellPx)+"px"; div.style.top=(minR*cellPx)+"px";
    div.style.width=((maxC-minC+1)*cellPx-2)+"px"; div.style.height=((maxR-minR+1)*cellPx-2)+"px";
    div.dataset.uid = rm.uid;
    const rec = synInfo.get(rm.uid);
    const nBonus = rec?rec.bonuses.length:0, nPen = rec?rec.penalties.length:0;
    const wide = (maxC-minC+1) >= 2; // 1-cell-wide rooms are too narrow for a label; show the icon only
    div.innerHTML = `<div class="rhead"><span class="ricon">${def.icon}</span>${wide?`<span>${def.nameAr}</span>`:""}</div>
      <div class="rbody"></div>
      <div class="lvl">Lv${rm.level}</div>
      <div class="pwr ${rm.active?"on":"off"}">${def.power>0?("+"+Math.round(def.power*(1+(rm.level-1)*0.25))+"⚡"):(rm.active?"":"⛔")}</div>`;
    if(nBonus) div.querySelector(".rhead").innerHTML += ` <span style="color:var(--green);font-size:9px">▲${nBonus}</span>`;
    if(nPen) div.querySelector(".rhead").innerHTML += ` <span style="color:var(--red);font-size:9px">▼${nPen}</span>`;
    div.addEventListener("click",()=>openRoomSheet(rm.uid));
    grid.appendChild(div);
    // crew tokens inside
    const body = div.querySelector(".rbody");
    const assigned = S.crew.filter(c=>c.room===rm.uid);
    assigned.forEach((c,i)=>{
      const tok = document.createElement("div");
      tok.className="tok";
      tok.textContent = ROLES[c.role].icon;
      const seed = (rm.uid.charCodeAt(rm.uid.length-1)+i*37 + Math.floor(Date.now()/1400))%100;
      const x = 20+((seed*7)%60), y = 30+((seed*13)%50);
      tok.style.left=x+"%"; tok.style.top=y+"%";
      tok.title = c.name;
      tok.addEventListener("click",(e)=>{e.stopPropagation(); openCrewSheet(c.uid);});
      body.appendChild(tok);
    });
  });

  document.getElementById("grid").className = document.getElementById("stage").classList.contains("buildmode")?"":"";
  renderTop();
  renderBuildBar();
}

document.getElementById("grid").addEventListener("click",(e)=>{

  const c = parseInt(cellEl.dataset.c), r = parseInt(cellEl.dataset.r);
  tryPlace(c,r);
});
function tryPlace(anchorC, anchorR){
  const shape = rotN(SHAPES[ROOMBYID[armedItem.defId].shape], armedItem.rot);
  if(!canPlace(shape, anchorC, anchorR, unlockedSet(), occupiedMap())){ toast("لا يمكن الوضع هنا"); return; }
  const cells = shape.map(([dc,dr])=>[anchorC+dc, anchorR+dr]);
  const rm = {uid:"r"+(++UID), defId:armedItem.defId, cells, level:1, active:true, crew:[]};
  S.rooms.push(rm);
  S.inventory.splice(armedItem.index,1);
  armedItem = null;

  toast("تم بناء "+ROOMBYID[rm.defId].nameAr);
}

/* Expansion picker: choose 1 of 3 shapes, then a valid anchor */
function openExpansionPicker(){
  const opts = [];
  while(opts.length<3){
    const s = EXPANSION_POOL[Math.floor(Math.random()*EXPANSION_POOL.length)];
    const rot = Math.floor(Math.random()*4);
    opts.push({shapeId:s, rot});
  }
  const body = `<h3 class="stitle">🧩 توسعة جديدة</h3><p class="sdesc">اختر شكلًا، ثم اضغط على الشبكة لتحديد مكان التركيب.</p>
    <div class="wrap">${opts.map((o,i)=>shapePreviewCard(o,i)).join("")}</div>`;
  openModal(body);
  document.querySelectorAll(".expopt").forEach(el=>{
    el.addEventListener("click",()=>{
      const i = parseInt(el.dataset.i);
      closeModal();
      armExpansion(opts[i]);
    });
  });
}
function shapePreviewCard(o,i){
  const cells = rotN(SHAPES[o.shapeId], o.rot);
  const maxC=Math.max(...cells.map(p=>p[0]))+1, maxR=Math.max(...cells.map(p=>p[1]))+1;
  let grid = `<div class="expopt" data-i="${i}" style="cursor:pointer;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:8px;display:inline-block">
    <div style="position:relative;width:${maxC*16}px;height:${maxR*16}px;margin:0 auto 4px">`;
  cells.forEach(([c,r])=>{ grid += `<div style="position:absolute;left:${c*16}px;top:${r*16}px;width:14px;height:14px;background:var(--green);border-radius:2px"></div>`; });
  grid += `</div><div style="font-size:10px;text-align:center;font-weight:700">${cells.length} خلايا</div></div>`;
  return grid;
}
let armedExpansion = null;
function armExpansion(o){
  armedExpansion = o;
  enterBuildMode();
  toast("اضغط على الشبكة لتحديد موقع التوسعة");
  highlightExpansionAnchors();
}
function highlightExpansionAnchors(){
  document.querySelectorAll(".cell.locked").forEach(el=>{
    el.addEventListener("click", expansionClickHandler);
  });
}
function expansionClickHandler(e){
  if(!armedExpansion) return;
  const c=parseInt(e.target.dataset.c), r=parseInt(e.target.dataset.r);
  const cells = rotN(SHAPES[armedExpansion.shapeId], armedExpansion.rot);
  const uSet = unlockedSet();
  // valid if all target cells are in-bounds, not entrance, not already unlocked, and at least one touches unlocked area
  let touches=false, ok=true;
  const targetCells=[];
  cells.forEach(([dc,dr])=>{
    const cc=c+dc, rr=r+dr;
    targetCells.push([cc,rr]);
    if(!inBounds(cc,rr) || (cc===ENTRANCE.c&&rr===ENTRANCE.r) || uSet.has(cellKey(cc,rr))) ok=false;
  });
  if(ok){
    targetCells.forEach(([cc,rr])=>{
      if((Math.abs(cc-ENTRANCE.c)+Math.abs(rr-ENTRANCE.r)===1)) touches=true;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ if(uSet.has(cellKey(cc+dx,rr+dy))) touches=true; });
    });
  }
  if(!ok || !touches){ toast("موقع غير صالح"); return; }
  targetCells.forEach(([cc,rr])=>S.unlocked.push(cellKey(cc,rr)));
  S.expansions--;
  armedExpansion = null;
  document.querySelectorAll(".cell.locked").forEach(el=>el.removeEventListener("click", expansionClickHandler));
  save(); render();
  toast("تم توسيع المخبأ!");
}

function openRoomSheet(uid){

  let vaultHtml = "";
  if(info.vaultDepth!==undefined){
    const safe = info.vaultDepth>=3;
    vaultHtml = `<div class="pill" style="color:${safe?'var(--green)':'var(--red)'}">${safe?'🛡️ عمق آمن':'⚠️ قريب من المدخل — خطر سرقة'}</div>`;

      <div class="pill">${rm.active?"⚡ يعمل":"⛔ متوقف"}</div>
      <div class="pill">👥 ${assigned.length}/${def.crewCap}</div>
      ${bonusHtml}${penHtml}${vaultHtml}
    </div>
    <h4 style="font-size:11px;color:var(--muted);margin:10px 0 5px">الطاقم في الغرفة</h4>
    <div class="wrap">${assigned.map(c=>`<div class="pill">${ROLES[c.role].icon} ${c.name} <button data-un="${c.uid}" style="color:var(--red);font-weight:900">✕</button></div>`).join("")||'<span style="color:var(--muted);font-size:11px">لا أحد</span>'}</div>
    ${free.length && assigned.length<def.crewCap ? `<h4 style="font-size:11px;color:var(--muted);margin:10px 0 5px">تعيين عضو</h4>
    <div class="wrap">${free.map(c=>`<button class="btn" data-as="${c.uid}">${ROLES[c.role].icon} ${c.name}</button>`).join("")}</div>` : ""}
    <div class="row" style="margin-top:14px;gap:8px">
      <button class="btn primary" id="upgradeRoomBtn">⬆️ تطوير (${upgradeCost(rm)} Parts)</button>
      <button class="btn danger" id="sellRoomBtn">بيع</button>
    </div>`;
  openSheet(body);
  document.querySelectorAll("[data-as]").forEach(b=>b.addEventListener("click",()=>{ assignCrew(b.dataset.as, uid); openRoomSheet(uid); render(); }));
  document.querySelectorAll("[data-un]").forEach(b=>b.addEventListener("click",()=>{ unassignCrew(b.dataset.un); openRoomSheet(uid); render(); }));
  document.getElementById("upgradeRoomBtn").addEventListener("click",()=>upgradeRoom(uid));
  document.getElementById("sellRoomBtn").addEventListener("click",()=>sellRoom(uid));
}
function upgradeCost(rm){ return 30 + rm.level*35; }
function upgradeRoom(uid){
  const rm = S.rooms.find(r=>r.uid===uid);
  const cost = upgradeCost(rm);
  if(S.resources.parts<cost){ toast("Parts غير كافية"); return; }
  S.resources.parts -= cost; rm.level++;
  save(); closeSheet(); render();
  toast("تم التطوير إلى Lv"+rm.level);
}
function sellRoom(uid){
  const idx = S.rooms.findIndex(r=>r.uid===uid); if(idx<0) return;
  const rm = S.rooms[idx];
  S.crew.forEach(c=>{ if(c.room===uid) c.room=null; });
  S.resources.cash += Math.round(ROOMBYID[rm.defId].cost*0.4);
  S.rooms.splice(idx,1);
  save(); closeSheet(); render();
  toast("تم بيع الغرفة");
}

function rollShop(paid){
  const cost = paid ? (10+ (S.shopRerolls||0)*8) : 0;
  if(paid){
    if(S.resources.cash<cost){ toast("كاش غير كافٍ لإعادة العرض"); return; }
    S.resources.cash -= cost; S.shopRerolls=(S.shopRerolls||0)+1;
  }
  const roomPool = ROOMS.filter(r=>!S.frozenIds || !S.frozenIds.includes("keep"));
  const picks = [];
  // 2 rooms, 1 crew, 1 wildcard(room or expansion)
  for(let i=0;i<2;i++) picks.push({kind:"room", defId: weightedRoom()});

}
function weightedRoom(){

function runEconomyTick(){
  const info = computeRoomState();
  let cashGain=0, partsGain=0, intelGain=0, respectGain=1;
  S.rooms.forEach(rm=>{
    if(!rm.active) return;
    const def = ROOMBYID[rm.defId];
    const mult = info.get(rm.uid)?.mult || {};
    const lvlMult = 1+(rm.level-1)*0.25;
    if(def.id==="workshop") partsGain += 14*lvlMult*(1+(mult.parts||0));
    if(def.id==="front_business") cashGain += 22*lvlMult*(1+(mult.cash||0));
    if(def.id==="intel_room") intelGain += 6*lvlMult*(1+(mult.intel||0));
    if(def.id==="server_room") intelGain += 8*lvlMult;
    if(def.id==="hacker_lab") intelGain += 10*lvlMult;
    if(def.id==="black_market") cashGain += 12*lvlMult;
    if(def.id==="clinic"){
      S.crew.filter(c=>c.hp<c.maxHp && !c.room==null).forEach(c=>{});
    }
  });
  // clinic healing for crew located in any active clinic
  S.rooms.filter(r=>r.defId==="clinic"&&r.active).forEach(rm=>{
    const mult = 1+((info.get(rm.uid)?.mult.heal)||0);
    S.crew.forEach(c=>{ if(c.room===rm.uid){ c.hp=Math.min(c.maxHp, c.hp+Math.round(8*mult)); if(c.hp>=c.maxHp) c.injured=false; } });
  });
  // morale from support rooms
  S.rooms.filter(r=>["bedroom","kitchen","lounge"].includes(r.defId)&&r.active).forEach(rm=>{
    S.crew.forEach(c=>{ if(c.room===rm.uid) c.morale=Math.min(100,c.morale+5); });
  });
  S.crew.forEach(c=>{ if(!c.room) c.morale=Math.max(0,c.morale-2); c.loyalty=Math.min(100,c.loyalty+ (c.morale>60?1:0)); });
  S.resources.cash += cashGain; S.resources.parts += partsGain; S.resources.intel += intelGain; S.resources.respect += respectGain;
  S.heat = Math.max(0, S.heat - 2);
  const districtBonus = DISTRICTS[S.districtIdx].threat*0.6;
  S.heat += districtBonus;
  save();
}

/* ============================================================================================
   RAID / COMBAT
   ============================================================================================ */
function buildGraph(){
  // nodes: "entrance" + room uids. edge weight = defensive resistance of destination room.
  const nodes = {entrance:{neighbors:[]}};
  S.rooms.forEach(rm=> nodes[rm.uid]={neighbors:[]});
  S.rooms.forEach(rm=>{
    if(roomTouchesEntrance(rm)) nodes.entrance.neighbors.push(rm.uid);
  });
  roomsAdjacentPairs().forEach(([a,b])=>{
    nodes[a.uid].neighbors.push(b.uid);
    nodes[b.uid].neighbors.push(a.uid);
  });
  return nodes;
}
function roomDefenseWeight(rm){
  const def = ROOMBYID[rm.defId];
  let w = 1;
  if(def.cat==="DEFENSE") w += 3;
  if(def.id==="guard_room") w += S.crew.filter(c=>c.room===rm.uid).length*1.5;
  if(!rm.active) w = Math.max(0.4,w-2); // powered-down defenses are weaker
  return w;
}
function findPath(targetUid){
  const graph = buildGraph();
  const dist = {entrance:0}; const prev={}; const visited=new Set();
  const pq = [{n:"entrance",d:0}];
  while(pq.length){
    pq.sort((a,b)=>a.d-b.d);
    const {n} = pq.shift();
    if(visited.has(n)) continue; visited.add(n);
    (graph[n]?.neighbors||[]).forEach(nb=>{
      const rm = S.rooms.find(r=>r.uid===nb);
      const w = rm?roomDefenseWeight(rm):1;
      const nd = dist[n]+w;
      if(dist[nb]===undefined || nd<dist[nb]){ dist[nb]=nd; prev[nb]=n; pq.push({n:nb,d:nd}); }
    });
  }
  if(dist[targetUid]===undefined) return null;
  const path=[targetUid]; let cur=targetUid;
  while(prev[cur]!==undefined){ cur=prev[cur]; path.unshift(cur); }
  return path; // ["entrance", uid1, uid2, ...]
}
function resolveTargetRoom(objective){
  if(objective==="vault") return S.rooms.find(r=>r.defId==="vault") || S.rooms.find(r=>r.defId==="secret_vault");
  if(objective==="generator") return S.rooms.find(r=>r.defId==="generator");
  if(objective==="intel") return S.rooms.find(r=>r.defId==="server_room") || S.rooms.find(r=>r.defId==="intel_room");
  if(objective==="workshop") return S.rooms.find(r=>r.defId==="workshop");
  if(objective==="control_room") return S.rooms.find(r=>r.defId==="control_room");
  if(objective==="crew"){ const withCrew = S.rooms.filter(r=>S.crew.some(c=>c.room===r.uid)); return withCrew[Math.floor(Math.random()*withCrew.length)] || S.rooms[0]; }
  return S.rooms[0];
}

let RAID = null;
function startRaid(){
  S.phase="raid";
  const objective = S._pendingObjective || pickObjective();
  const isBoss = S._pendingBoss;
  const targetRoom = resolveTargetRoom(objective);
  if(!targetRoom || !S.rooms.length){
    // nothing to raid — trivial pass
    finishRaid(true, "لا يوجد ما يستحق المداهمة بعد.");
    return;
  }
  const path = findPath(targetRoom.uid) || ["entrance", targetRoom.uid];
  const heatMult = 1+S.heat/100;
  const districtMult = 1+DISTRICTS[S.districtIdx].threat*0.18;
  const bossMult = isBoss?1.8:1;
  const squadPower = Math.round(10*heatMult*districtMult*bossMult);
  RAID = {
    objective, targetUid: targetRoom.uid, path, pathIdx:1, isBoss,
    attackerHp: Math.round(squadPower*6), attackerHpMax:0, attackerDmg: Math.round(squadPower*0.9),
    commands: 3 + (S.rooms.some(r=>r.defId==="control_room"&&r.active)?1:0),
    log: [], done:false, ticking:false,
    lockdownUid:null, decoyUsed:false,
  };
  RAID.attackerHpMax = RAID.attackerHp;
  S.raidTargetUid = targetRoom.uid;
  S.raidClearedUids = new Set();
  render();
  openRaidModal();
  raidLog(`<b>مداهمة!</b> الهدف: ${objectiveLabel(objective)}${isBoss?' — <b style="color:var(--red)">زعيم</b>':''}`);
  raidTick();
}
function openRaidModal(){

    <div class="pillrow"><div class="pill">🎯 ${objectiveLabel(RAID.objective)}</div><div class="pill">🧨 قوة المهاجم: <span id="atkHp">${RAID.attackerHp}</span></div></div>
    <div id="log"></div>

function renderTactRow(){
  const cmds = [
    {id:"lockdown",ic:"🔒",label:"Lockdown"},

    {id:"overclock",ic:"⚡",label:"Overclock"},
    {id:"medkit",ic:"💉",label:"Medkit"},
    {id:"fallback",ic:"↩️",label:"Fall Back"},

  ];

    + `<div style="grid-column:span 4;text-align:center;font-size:10px;color:var(--muted);margin-top:2px">أوامر متبقية: ${RAID.commands}</div>`;

}
function raidLog(msg){
  RAID.log.push(msg);
  const el = document.getElementById("log");
  if(el){ el.innerHTML = RAID.log.slice(-14).map(m=>`<div>${m}</div>`).join(""); el.scrollTop = el.scrollHeight; }

function useTactical(cmd){
  if(RAID.commands<=0 || RAID.done) return;
  RAID.commands--;
  const curUid = RAID.path[RAID.pathIdx];
  const curRoom = S.rooms.find(r=>r.uid===curUid);
  if(cmd==="lockdown"){
    RAID.lockdownUid = curUid;
    raidLog(`🔒 تم إغلاق باب ${curRoom?ROOMBYID[curRoom.defId].nameAr:''} مؤقتًا — تأخير المهاجم.`);
    RAID.attackerHp += Math.round(RAID.attackerHpMax*0.06); // attacker must find another way, small extra grind
  } else if(cmd==="rally"){
    S.crew.forEach(c=>{ if(c.room===curUid) c.dmg = Math.round(c.dmg*1.25); });
    raidLog(`📣 تجميع الطاقم — ضرر مضاعف مؤقتًا في الغرفة الحالية.`);
  } else if(cmd==="overclock"){
    const tech = S.rooms.find(r=>["intel_room","server_room","hacker_lab"].includes(r.defId));
    if(tech){ RAID.attackerHp = Math.max(1, RAID.attackerHp - Math.round(RAID.attackerHpMax*0.1)); raidLog(`⚡ Overclock — ${ROOMBYID[tech.defId].nameAr} تُربك المهاجم.`); }
    else raidLog(`⚡ لا توجد غرفة تقنية لتشغيلها.`);
  } else if(cmd==="medkit"){
    const injured = S.crew.filter(c=>c.hp<c.maxHp).sort((a,b)=>a.hp-b.hp)[0];
    if(injured){ injured.hp = Math.min(injured.maxHp, injured.hp+Math.round(injured.maxHp*0.4)); raidLog(`💉 تم علاج ${injured.name}.`); }
    else raidLog(`💉 لا أحد يحتاج علاجًا الآن.`);
  } else if(cmd==="fallback"){
    const inDanger = S.crew.filter(c=>c.room===curUid);
    inDanger.forEach(c=>{ c.room=null; });
    raidLog(`↩️ تم سحب الطاقم من غرفة المواجهة.`);
  } else if(cmd==="empower"){
    if(curRoom){ curRoom.active=true; raidLog(`🔌 إعادة تشغيل طارئة لـ ${ROOMBYID[curRoom.defId].nameAr}.`); }
  } else if(cmd==="decoy"){
    if(!RAID.decoyUsed){ RAID.decoyUsed=true; RAID.attackerDmg = Math.round(RAID.attackerDmg*0.6); raidLog(`🎭 مسار وهمي يشتت جزءًا من المهاجمين — ضررهم انخفض.`); }
  }
  save(); render(); renderTactRow();
  const hpEl=document.getElementById("atkHp"); if(hpEl) hpEl.textContent=RAID.attackerHp;
}
function raidTick(){
  if(RAID.done) return;
  RAID.ticking = true;
  setTimeout(()=>{
    if(RAID.done) return;
    const curUid = RAID.path[RAID.pathIdx];
    if(!curUid){ // reached objective node itself with nothing left blocking
      finishRaid(false, "وصل المهاجمون إلى الهدف!");
      return;
    }
    if(curUid===RAID.lockdownUid){
      raidLog(`⛔ الباب مقفل — يبحث المهاجمون عن طريق آخر...`);
      RAID.lockdownUid=null; // one-time delay
      raidTick(); return;
    }
    const rm = S.rooms.find(r=>r.uid===curUid);
    if(!rm){ RAID.pathIdx++; raidTick(); return; }
    const def = ROOMBYID[rm.defId];
    const defenders = S.crew.filter(c=>c.room===curUid && c.hp>0);
    let defDmg = defenders.reduce((s,c)=>s+c.dmg,0) + (def.cat==="DEFENSE"?6:0) + (def.id==="armory"?4:0);
    if(defenders.length===1 && defenders[0].trait.name==="Lone Wolf") defDmg = Math.round(defDmg*1.3);
    if(!rm.active) defDmg = Math.round(defDmg*0.5);
    RAID.attackerHp = Math.max(0, RAID.attackerHp - defDmg);
    if(defDmg>0) raidLog(`<span class="hit">🥊 ${ROOMBYID[rm.defId].nameAr}</span> يلحق ${defDmg} ضرر بالمهاجمين. (متبقٍ ${RAID.attackerHp})`);
    else raidLog(`⚠️ لا مدافعين في ${ROOMBYID[rm.defId].nameAr} — المهاجمون يمرون بلا مقاومة.`);
    if(RAID.attackerHp<=0){ finishRaid(true, "تم صد المداهمة!"); return; }
    // attacker strikes back at defenders/room
    if(defenders.length){
      const target = defenders[Math.floor(Math.random()*defenders.length)];
      target.hp = Math.max(0, target.hp - RAID.attackerDmg);
      raidLog(`<span class="hit">💥</span> ${target.name} يتلقى ${RAID.attackerDmg} ضرر.`);
      if(target.hp<=0){ target.injured=true; target.hp=1; target.room=null; raidLog(`🩸 ${target.name} أُصيب بشدة وتم سحبه للأمان.`); }
    } else if(rm.uid===RAID.targetUid){
      raidLog(`💢 المهاجمون يخربون ${ROOMBYID[rm.defId].nameAr}!`);
    }
    S.raidClearedUids.add(curUid);
    RAID.pathIdx++;
    render();
    if(RAID.pathIdx>=RAID.path.length){ finishRaid(false, "وصل المهاجمون إلى الهدف!"); return; }
    raidTick();
  }, 1500);
}
function finishRaid(defenderWin, msg){
  RAID.done = true;
  raidLog(`<b class="${defenderWin?'win':'hit'}">${msg}</b>`);
  const rewardBox = document.querySelector("#modalBody");
  setTimeout(()=>{
    S.lastRaid = {win:defenderWin, objective:RAID.objective};
    resolveOutcome(defenderWin);
  }, 1100);
}
function resolveOutcome(win){
  let cashLoss=0, respectGain=0, cashReward=0, partsReward=0, intelReward=0;
  if(win){
    respectGain = 10 + Math.round(S.heat/5);
    cashReward = 30 + Math.round(S.heat*1.2);
    partsReward = 10;
    S.heat = Math.max(0, S.heat-6);
  } else {
    if(RAID.objective==="vault"){ cashLoss = Math.round(S.resources.cash*0.25); S.resources.cash-=cashLoss; }
    if(RAID.objective==="generator"){ const g=S.rooms.find(r=>r.defId==="generator"); if(g) g.active=false; }
    if(RAID.objective==="intel"){ S.resources.intel = Math.max(0, S.resources.intel-15); }
    respectGain = -8;
    S.heat = Math.max(0, S.heat-2);
    checkGameOver();
  }
  S.resources.respect = Math.max(0, S.resources.respect+respectGain);
  S.resources.cash += cashReward;
  S.resources.parts += partsReward;
  S.raidTargetUid=null;
  S.phase="reward";
  save();
  const body = `<h3 class="stitle">${win?"🏆 انتصار":"💀 خسارة جزئية"}</h3>
    <p class="sdesc">${win?"تمت حماية المخبأ بنجاح.":"لحق المخبأ ضرر لكن العصابة تستمر."}</p>
    <div class="pillrow">
      ${win?`<div class="pill" style="color:var(--gold)">+${cashReward} 💵</div><div class="pill" style="color:var(--orange)">+${partsReward} ⚙️</div><div class="pill" style="color:var(--violet)">+${respectGain} ⭐</div>`
      :`<div class="pill" style="color:var(--red)">-${cashLoss} 💵</div><div class="pill" style="color:var(--red)">${respectGain} ⭐</div>`}
    </div>
    <button class="btn primary block" id="rewardNext">التالي ▶</button>`;
  openModal(body);
  document.getElementById("rewardNext").addEventListener("click", advancePhase);
  render();
}
function checkGameOver(){
  const allDown = S.crew.every(c=>c.hp<=0 || c.injured) && S.crew.filter(c=>!c.injured).length===0;
  const brokeAndEmpty = S.resources.cash<=0 && S.rooms.length===0;
  if(allDown || brokeAndEmpty){
    S.gameover = true;
    const legacyGain = Math.round(S.resources.respect*0.8)+S.cycle*3;
    META.legacy += legacyGain; saveMeta();
    setTimeout(()=>{
      const body = `<h3 class="stitle">💀 نهاية الجولة</h3><p class="sdesc">انهار الطاقم أو المخبأ. اكتسبت <b>${legacyGain} 💠 Legacy</b> لفتح مزايا للجولة القادمة.</p>
        <button class="btn primary block" id="restartBtn">ابدأ جولة جديدة</button>`;
      openModal(body);
      document.getElementById("restartBtn").addEventListener("click",()=>{ localStorage.removeItem(SAVE_KEY); location.reload(); });
    }, 1300);
  }
}
function nextCycle(){
  S.cycle++;
  S.districtIdx = DISTRICTS.reduce((best,d,i)=> S.cycle>=d.minCycle?i:best, 0);
  S.phase = "hideout";
  S.shop = null; S.shopRerolls=0;
  save(); render();
}

/* ============================================================================================
   BOOT / RUN SETUP
   ============================================================================================ */
function boot(){
  loadMeta();
  const existing = load();
  if(existing && !existing.gameover){ S = existing; afterBoot(); return; }
  showSetup();
}
function showSetup(){
  const boot = document.getElementById("bootscreen");
  let chosenLeader = LEADERS[0].id, chosenBiz = BUSINESSES[0].id;
  function html(){
    return `
    <h1>HIDE<span>OUT</span></h1>
    <p>سيد المخبأ — ابنِ مخبأك، رتّب طاقمك بذكاء، وادفع الغارات بترتيب أفضل لا بأرقام أعلى فقط.</p>
    <div class="setupcol">
      <h4>اختر القائد</h4>
      ${LEADERS.map(l=>`<div class="pickcard leadopt ${l.id===chosenLeader?'sel':''}" data-l="${l.id}"><b>👑 ${l.name}</b><small>${l.trait.split("|")[1]}</small></div>`).join("")}
      <h4>اختر الواجهة الشرعية</h4>
      ${BUSINESSES.map(b=>`<div class="pickcard bizopt ${b.id===chosenBiz?'sel':''}" data-b="${b.id}"><b>${b.nameAr}</b><small>${b.bonus}</small></div>`).join("")}
    </div>
    <button class="btn primary block" id="startBtn" style="margin-top:6px">ابدأ 🔑</button>`;
  }
  boot.innerHTML = html();
  wire();
  function wire(){
    boot.querySelectorAll(".leadopt").forEach(el=>el.addEventListener("click",()=>{chosenLeader=el.dataset.l; boot.innerHTML=html(); wire();}));
    boot.querySelectorAll(".bizopt").forEach(el=>el.addEventListener("click",()=>{chosenBiz=el.dataset.b; boot.innerHTML=html(); wire();}));
    document.getElementById("startBtn").addEventListener("click",()=>{
      S = freshRun(chosenLeader, chosenBiz);
      // starter rooms placed automatically so the player begins mid-scene, not an empty grid:
      // a Generator (2x2) fills the left of the starting plot, a Bedroom (1x2) the right column.
      S.rooms = [];
      placeStarter("generator", 2,1);
      placeStarter("bedroom", 4,1);
      // seat the starter crew so the hideout feels lived-in from the first frame
      const genRoom = S.rooms.find(r=>r.defId==="generator");
      const bedRoom = S.rooms.find(r=>r.defId==="bedroom");
      const mech = S.crew.find(c=>c.role==="MECHANIC"); if(mech && genRoom) mech.room = genRoom.uid;
      const enf = S.crew.find(c=>c.role==="ENFORCER"); if(enf && bedRoom) enf.room = bedRoom.uid;
      save();
      document.getElementById("bootscreen").remove();
      afterBoot();
    });
  }
}
function placeStarter(defId, c, r){
  const shape = SHAPES[ROOMBYID[defId].shape];
  const cells = shape.map(([dc,dr])=>[c+dc,r+dr]);
  S.rooms.push({uid:"r"+(++UID), defId, cells, level:1, active:true, crew:[]});
}
function afterBoot(){
  document.querySelector('[data-tab="hideout"]').classList.add("active");
  render();
  window.addEventListener("resize", render);
  toast("مرحبًا بك في مخبأك. ابدأ الدورة الأولى من الأسفل.");
}
boot();
</script>
</body>
</html>
